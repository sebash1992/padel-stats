<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Estadisticas de Padel</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-grid>
    <ion-row>
      <ion-col size="12">
        <ion-button expand="block" class="menu-button"(click)="newGame()">{{"NUEVO PARTIDO" | translate}}</ion-button>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col size="12">
        <ion-button expand="block" class="menu-button"(click)="loadGames()">{{"CARGAR PARTIDO" | translate}}</ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
