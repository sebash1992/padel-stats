<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start" (click)='goBack()'>
      <ion-icon name="chevron-back-outline" size="large"></ion-icon> {{"VOLVER" | translate}}
    </ion-buttons>
    <ion-title>{{"NUEVO PARTIDO" | translate}}</ion-title>
    <ion-buttons slot="primary">
      <ion-button (click)='createNewGame()'>
        {{"CREAR" | translate}}
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
  
</ion-header>

<ion-content [fullscreen]="true">
  <ion-grid>
    <ion-row>
      <ion-col size="5">
        {{"PAREJA 1" | translate}}
        <ion-grid>
          <ion-row>
            <ion-col>
              <ion-input [attr.label]="'DRIVE' | translate"  [(ngModel)]="t1Drive" color="light"></ion-input>
            </ion-col>
          </ion-row>
          <ion-row>
            <ion-col>
              <ion-input [attr.label]="'REVES' | translate"  [(ngModel)]="t1Reves"></ion-input>
            </ion-col>
          </ion-row>
        </ion-grid>
      </ion-col>
      <ion-col size="5" offset="2">
        {{"PAREJA 2" | translate}}
        <ion-grid>
          <ion-row>
            <ion-col>
              <ion-input [attr.label]="'DRIVE' | translate"  [(ngModel)]="t2Drive"></ion-input>
            </ion-col>
          </ion-row>
          <ion-row>
            <ion-col>
              <ion-input [attr.label]="'REVES' | translate"  [(ngModel)]="t2Reves"></ion-input>
            </ion-col>
          </ion-row>
        </ion-grid>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col>
        {{"SET IGUALES" | translate}}
        <ion-list>
          <ion-radio-group [value]="definitionSet" (ionChange)="onSetChange($event)">
            <ion-item>
              <ion-radio value="3" justify="space-between" color="light">{{"3 SET" | translate}}</ion-radio>
            </ion-item>
            <ion-item>
              <ion-radio value="4" justify="space-between" color="light">{{"SUPER TIE BREAK" | translate}}</ion-radio>
            </ion-item>
          </ion-radio-group>
        </ion-list>
      </ion-col>
      <ion-col>
        <!-- <ion-radio-group value="oro">
          <ion-radio slot="start" value="oro" item-left>Punto de Oro</ion-radio><br />
          <ion-radio slot="start" value="diferencia" item-left>Diferencia</ion-radio><br />
        </ion-radio-group> -->
        <!-- <ion-list>
          <ion-radio-group [value]="definitionWhenTie">
            <ion-item>
              <ion-radio value="oro" justify="space-between">Punto de Oro</ion-radio>
            </ion-item>
            <ion-item>
              <ion-radio value="diferencia" justify="space-between">Diferencia</ion-radio>
            </ion-item>
          </ion-radio-group>
        </ion-list> -->
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
